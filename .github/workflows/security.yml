name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lint, build y auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Buscar secretos obvios
        shell: bash
        run: |
          if git grep -nE 'eyJ[A-Za-z0-9_-]{20,}\.|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{20,}' -- . ':!package-lock.json' ':!*.md'; then
            echo "::error::Posible secreto detectado en el repositorio"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
